name: SaveTube desktop release

# Publishes the installers of finished builds as a GitHub Release, on GitHub's own runner (the large
# files never travel through a slow home connection). If the release exists, the files are added to it.
# Run it with: gh workflow run desktop-release.yml -f tag=v1.0.2 -f title="..." -f notes="..."
#   -f windows_run=<windows-exe run id> -f packages_run=<desktop-packages run id>
# Either run id may be left out.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, e.g. v1.0.2
        required: true
      title:
        description: The release title (used when the release is created)
        required: true
      notes:
        description: The release notes (Markdown, used when the release is created)
        required: true
      windows_run:
        description: The id of the finished "SaveTube Windows installer" run
        required: false
      packages_run:
        description: The id of the finished "SaveTube macOS and Linux packages" run
        required: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Download the installers of the runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl
          if [ -n "${{ inputs.windows_run }}" ]; then
            gh run download "${{ inputs.windows_run }}" --repo "${{ github.repository }}" --pattern 'SaveTube-windows-*' --dir dl
          fi
          if [ -n "${{ inputs.packages_run }}" ]; then
            gh run download "${{ inputs.packages_run }}" --repo "${{ github.repository }}" --pattern 'SaveTube-*' --dir dl
          fi
          find dl -type f | sort

      - name: Name the files and write the checksums
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p out
          while IFS= read -r f; do
            case "$f" in
              *.exe) cp "$f" "out/SaveTube-$version-windows-x64-setup.exe" ;;
              *macos-arm64*.dmg) cp "$f" "out/SaveTube-$version-macos-apple-silicon.dmg" ;;
              *macos-x64*.dmg) cp "$f" "out/SaveTube-$version-macos-intel.dmg" ;;
              *.deb) cp "$f" "out/SaveTube-$version-linux-x64.deb" ;;
              *.rpm) cp "$f" "out/SaveTube-$version-linux-x64.rpm" ;;
              *.AppImage) cp "$f" "out/SaveTube-$version-linux-x64.AppImage" ;;
            esac
          done < <(find dl -type f)
          test -n "$(ls out)"
          (cd out && sha256sum * > "SaveTube-$version-desktop.sha256")
          ls -la out

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          if gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ inputs.tag }}" out/* --repo "${{ github.repository }}" --clobber
          else
            printf '%s\n' "$NOTES" > notes.md
            gh release create "${{ inputs.tag }}" out/* --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" --title "${{ inputs.title }}" --notes-file notes.md
          fi
